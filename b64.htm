<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video to Base64</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #1f2937;
            padding: 30px;
            border-radius: 16px;
            width: 700px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        input[type="file"] {
            width: 100%;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            background: #0f172a;
            color: #00ff99;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 10px;
            resize: vertical;
            font-family: monospace;
        }

        .copy-btn {
            margin-top: 10px;
            background: #10b981;
        }

        .copy-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video → Base64 Converter</h1>

        <input type="file" id="videoInput" accept="video/*">

        <button onclick="convertToBase64()">Convert to Base64</button>

        <textarea id="output" placeholder="Base64 Data URI will appear here..."></textarea>

        <button class="copy-btn" onclick="copyOutput()">Copy Base64</button>
    </div>

    <script>
        async function convertToBase64() {
            const fileInput = document.getElementById('videoInput');
            const output = document.getElementById('output');

            const file = fileInput.files[0];

            if (!file) {
                alert('Please upload a video first.');
                return;
            }

            const reader = new FileReader();

            reader.onload = function(event) {
                output.value = event.target.result;
                console.log(event.target.result);
            };

            reader.onerror = function() {
                alert('Error reading file.');
            };

            reader.readAsDataURL(file);
        }

        function copyOutput() {
            const output = document.getElementById('output');

            if (!output.value) {
                alert('Nothing to copy.');
                return;
            }

            output.select();
            document.execCommand('copy');

            alert('Copied to clipboard!');
        }
    </script>

</body>
</html>
